<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zapatilla Urbana - HYA Moda</title>

<style>
*{box-sizing:border-box;}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;

    /* Fondo en mosaico */
    background-image: url('../imagenes/fondo.jpeg');
    background-repeat: repeat;          /* se repite horizontal y vertical */
    background-size: 200px 200px;      /* tamaño de cada "bloque" de la imagen */
}



/* ===== PANTALLA DE CARGA ===== */
#loader{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    /* Fondo igual que el body */
    background-color: #ffffff; /* fondo blanco */
    background-size: cover;

    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
}

 

#loader img{
    width:120px;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* OCULTA CONTENIDO AL INICIO */
#contenido{
    display:none;
}

/* HEADER */

header {
    background: transparent;
    color: white;
    padding: 20px;
    text-align: center;
}

.descripcion {
    background: transparent;
    padding: 20px;
    border-radius: 10px;
}
.descripcion p, header h1, header p {
    text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
}



/* ===== CONTENEDOR GENERAL 2 COLUMNAS ===== */
.producto{
    width:90%;
    max-width:1200px;
    margin:30px auto;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:40px;
}

/* ===== COLUMNA IZQUIERDA ===== */
.producto-fotos{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* VISOR */
.visor{
    position:relative;
    overflow:hidden;
    border-radius:15px;
    cursor:zoom-in;
    display:inline-flex;
    justify-content:center;
    align-items:center;
}

.visor img{
    max-height:450px;
    width:auto;
    height:auto;
    object-fit:contain;
    transition:transform .15s ease;
    transform-origin:center;
}

/* MINIATURAS */
.galeria{
    margin-top:15px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.galeria img{
    width:65px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .2s ease;
}

.galeria img:hover{
    transform:scale(1.1);
}

/* ===== COLUMNA DERECHA ===== */
.producto-info{
    display:flex;
    flex-direction:column;
    gap:25px;
}


.video-modelo{
    width:100%;
    display:flex;
    justify-content:center;
}

.video-modelo video{
    width:60%;
    max-width:500px;
    border-radius:10px;
}

/* WHATSAPP */
.whatsapp-box{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    z-index:9999;
}

.whatsapp-text{
    background:#111;
    color:white;
    font-size:13px;
    padding:6px 10px;
    border-radius:8px;
    white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.whatsapp-btn{
    background:#25D366;
    width:56px;
    height:56px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 6px 15px rgba(0,0,0,.35);
}

.whatsapp-btn img{
    width:32px;
    height:32px;
}

/* ===== RESPONSIVE ===== */
/* ===== RESPONSIVE PARA CELULAR ===== */
@media (max-width: 768px) {
    .producto {
        display: grid;
        grid-template-columns: 1fr; /* solo una columna */
        gap: 20px; /* separación vertical entre columnas */
        width: 95%;
        margin: 20px auto;
    }

    /* Forzar el orden de columnas en celular */
    .producto-fotos {
        order: 1; /* primero */
        width: 100%;
    }

    .producto-info {
        order: 2; /* después */
        width: 100%;
    }

    .visor img {
        max-width: 100%;
        height: auto;
    }

    .galeria {
        justify-content: center;
        gap: 10px;
    }

    .galeria img {
        width: 50px;
        height: auto;
    }

    .video-modelo video {
        width: 100%;
        max-width: 100%;
    }

    .descripcion {
        padding: 15px;
    }
}


</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->
<div id="loader">
    <img src="IMAGEN/cargando.jpg" alt="Cargando">
</div>

<!-- CONTENIDO REAL -->
<div id="contenido">

<header>
    <h1>Zapatilla Urbana</h1>
    <p>Explora cada detalle del modelo</p>
</header>

<div class="producto">

    <div class="producto-fotos">
        <div class="visor" id="visor">
            <img id="visor-img">
        </div>

        <div class="galeria">
            <img src="IMAGEN/1.jpeg" onclick="mostrar(this)">
            <img src="IMAGEN/2.jpeg" onclick="mostrar(this)">
            <img src="IMAGEN/3.jpeg" onclick="mostrar(this)">
            <img src="IMAGEN/4.jpeg" onclick="mostrar(this)">
        </div>
    </div>

    <div class="producto-info">
        <div class="descripcion">
            <h2>Detalles del Modelo</h2>
            <p>
                Zapatilla urbana cómoda, ligera y moderna.
                Ideal para uso diario y disponible en varias tallas.
            </p>
        </div>

        <div class="video-modelo">
            <video controls>
                <source src="IMAGEN/1.mp4" type="video/mp4">
            </video>
        </div>
    </div>

</div>

<div class="whatsapp-box">
    <div class="whatsapp-text">Chatea con nosotros</div>
    <a href="https://wa.me/51974309455" class="whatsapp-btn" target="_blank">
        <img src="IMAGEN/whatsapp.png" alt="WhatsApp">
    </a>
</div>

</div>

<script>
/* ===== PANTALLA DE CARGA ===== */
window.addEventListener("load", ()=>{
    setTimeout(()=>{
        document.getElementById("loader").style.display="none";
        document.getElementById("contenido").style.display="block";
    },1500);
});

/* ZOOM IMAGEN */
const visor = document.getElementById("visor");
const visorImg = document.getElementById("visor-img");

function mostrar(img){
    visorImg.src = img.src;
    visorImg.style.transform = "scale(1)";
}

visor.addEventListener("mousemove", e=>{
    if(!visorImg.src) return;

    visorImg.style.transform = "scale(2.5)";
    const rect = visor.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    visorImg.style.transformOrigin = `${x}% ${y}%`;
});

visor.addEventListener("mouseleave", ()=>{
    visorImg.style.transform = "scale(1)";
    visorImg.style.transformOrigin = "center";
});

window.addEventListener("DOMContentLoaded", ()=>{
    const primera = document.querySelector(".galeria img");
    if(primera) mostrar(primera);
});
</script>

</body>
</html>
