<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYA Moda</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">


<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

/* ===== BODY ===== */
body{
    margin:0;
    font-family:'Montserrat', sans-serif;
    background:#ffffff; /* BLANCO */
    color:#1e1e1e;
}

/* ===== HERO (NEGRO) ===== */
.hero{
    background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
        url("fondo1.jpeg") center/cover no-repeat;
    color:white;
    text-align:center;
    padding:80px 20px 110px;
    border-bottom-left-radius:70px;
    border-bottom-right-radius:70px;
}

.hero-content{
    display:flex;
    flex-direction:row;
    justify-content:space-between;
    align-items:center;
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.hero-carousel{
    flex:1;
    margin-right:20px;
}

.hero-text{
    flex:1;
    text-align:right; /* texto alineado a la derecha */
    color:white;
}

.hero-text h1{
    font-size:36px;
    margin-bottom:20px;
}

.hero-text p{
    font-size:18px;
    margin-bottom:30px;
}

.hero-text .btn{
    display:inline-block;
    background:#c05a8f;
    color:white;
    padding:12px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

/* CELULAR */
@media(max-width:768px){
    .hero-content{
        flex-direction:column;
        text-align:center;
    }
    .hero-text{
        text-align:center; 
        margin-top:20px;
    }
    .hero-carousel{
        margin-right:0; 
        margin-bottom:20px;
    }

    /* ajustar tamaño de título */
    .hero h1{
        font-size:26px; /* antes 40px, más pequeño en celular */
    }

    /* ===== CAMBIO SLIDER CELULAR ===== */
    .slider-item{
        flex:0 0 45%; /* mostrar 2 imágenes completas */
    }

    /* quitar hover/zoom solo en móvil */
    .slider-item:hover img{
        transform: scale(1);
    }

    /* mover flechas arriba y abajo solo en móvil */
    .arrow{
        left:50%;        /* centradas horizontal */
        top:auto;        /* reinicia top */
        transform:translateX(-50%);
    }
    .arrow.left{top:10px;}    /* flecha arriba */
    .arrow.right{bottom:10px;} /* flecha abajo */
}


/* ===== CARRUSEL SUPERIOR ===== */

/* ===== CARRUSEL ESTILO REVISTA ===== */
.carousel{
    width:28%;
    margin:auto;
    overflow:hidden;
    background:#ffffff;
    border-radius:18px; /* menos redondo = más editorial */
    box-shadow:0 40px 80px rgba(0,0,0,.45);
    border:1px solid #e6e6e6;
}

/* IMAGEN ESTILO PORTADA */
/* ===== REVISTA ===== */
.magazine{
    width:300px;
    height:420px;
    margin:auto;
    perspective:1600px;
}

.page{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
}

.page img{
    width:120%;
    height:120%;
    position:absolute;
    top:-60px;
    left:-60px;
    object-fit:cover;
    transition: opacity 1.5s ease, transform 1.5s ease;
    backface-visibility:hidden;

  /* ===== BORDES DESVANECIDOS RECTANGULAR 10% ===== */
-webkit-mask-image: 
    linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%) /* vertical */
    , linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%) /* horizontal */;
-webkit-mask-composite: destination-in;
-webkit-mask-repeat: no-repeat;
-webkit-mask-position: center;
-webkit-mask-size: cover;

mask-image: 
    linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%) 
    , linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
mask-composite: intersect;
mask-repeat: no-repeat;
mask-position: center;
mask-size: cover;

}

    


.carousel::after{
    content:"Colección 2026";
    position:absolute;
    bottom:20px;
    left:20px;
    font-family:'Playfair Display', serif;
    font-size:22px;
    color:white;
    letter-spacing:2px;
}

/* ===== PRODUCTOS (ROSADO SUAVE) ===== */
.productos{
    padding:100px 20px 80px;
    text-align:center;
    margin-top:-60px;
    border-top-left-radius:70px;
    border-top-right-radius:70px;

    /* Fondo con imagen + degradado semitransparente */
    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), /* oscurece un poco */
        url("fondo2.jpeg") center/cover no-repeat;
}


.productos h2{
    font-family:'Playfair Display', serif;
    font-size:34px;
    margin-bottom:50px;
    color:#f2f2f2;
    letter-spacing:1.2px;
}


/* ===== SLIDER ===== */
.slider-container{
    position:relative;
    width:94%;
    height:420px;
    margin:auto;
    overflow:hidden;


}

.slider-track{
    display:flex;
    gap:35px;
    padding:35px 0;
    cursor:grab;
}

/* ===== ITEM ===== */
.slider-item{
    flex:0 0 200px;
}

.slider-item img{
    width:100%;
    border-radius:30px;
    padding:0;                 /* ❌ sin borde */
    background:transparent;    /* ❌ sin fondo blanco */
    box-shadow:0 25px 55px rgba(0,0,0,.45);
    transition:transform .4s ease, box-shadow .4s ease;
}


.slider-item:hover img{
    transform:scale(1.4);
}

/* ===== FLECHAS ===== */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:#0f0f0f;
    color:#c05a8f;
    border:none;
    font-size:28px;
    padding:14px 18px;
    cursor:pointer;
    border-radius:15px;
    z-index: 10; /* nuevo: siempre delante de las imágenes */
}


.arrow.left{left:10px}
.arrow.right{right:10px}

/* ===== WHATSAPP ===== */
.whatsapp{
    position:fixed;
    bottom:24px;
    right:24px;
    background:#25D366;
    color:white;
    font-size:28px;
    padding:16px;
    border-radius:50%;
}

/* ===== CELULAR ===== */
@media(max-width:768px){
    .hero h1{font-size:26px}
    .carousel{width:100%; max-width:330px}
    .slider-item{flex:0 0 160px}
}
</style>


</head>

<body>
<!-- HTML + JS quedan exactamente iguales -->
</body>
</html>

<section class="hero">
  <div class="hero-content">
    <div class="hero-carousel">
      <div class="magazine">
        <div class="page" id="page"></div>
      </div>
    </div>
    <div class="hero-text">
      <h1>Descubre la moda que marca tu estilo</h1>
      <p>Explora nuestra colección 2026 y encuentra tus zapatillas favoritas.</p>
     
    </div>
  </div>
</section>


<section class="productos">
    <h2>Nuestras Zapatillas</h2>

    <div class="slider-container">
        <button class="arrow left" onclick="mover(-1)">‹</button>
        <div class="slider-track" id="slider-track"></div>
        <button class="arrow right" onclick="mover(1)">›</button>
    </div>
</section>

<div class="modal" id="modal">
    <span class="cerrar" onclick="cerrarGaleria()">×</span>
    <img id="modal-img">
</div>

<a href="https://wa.me/51974309455" class="whatsapp" target="_blank">💬</a>

<script>
const carpeta="imagenes/carrusel/";
const imagenes=[
"1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
"6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg","11.jpeg","12.jpeg","13.jpeg","14.jpeg","15.jpeg","16.jpeg","17.jpeg","18.jpeg","19.jpeg","20.jpeg","21.jpeg","22.jpeg"
];

/* ===== CARRUSEL SUPERIOR CLÁSICO ===== */
const page = document.getElementById("page");
let index = 0;

const img = document.createElement("img");
img.src = carpeta + imagenes[0];
img.style.opacity = 1;
img.style.transition = "opacity 1.2s ease, transform 1.2s ease";
page.appendChild(img);

setInterval(() => {
    img.style.opacity = 0;
    img.style.transform = "scale(1.05)";

    setTimeout(() => {
        index = (index + 1) % imagenes.length;
        img.src = carpeta + imagenes[index];
        img.style.transform = "scale(1)";
        img.style.opacity = 1;
    }, 1200);

}, 3500);



/* SEGUNDO CARRUSEL */
const sliderTrack=document.getElementById("slider-track");
const container = document.querySelector(".slider-container");
const itemWidth = 200; 
let currentIndex = 0;

imagenes.forEach((img, i)=>{
    const div=document.createElement("div");
    div.className="slider-item";

    div.innerHTML = `
        <a href="MODEL${i+1}/${i+1}.html">
            <img src="${carpeta + img}">
        </a>
    `;
    sliderTrack.appendChild(div);
});

/* EVITAR QUE IMAGENES SE ARRASTREN */
document.querySelectorAll('.slider-item img').forEach(img=>{
    img.ondragstart = () => false;
});

/* FUNCION DESPLAZAMIENTO FLECHAS */
function mover(dir){
    currentIndex += dir;

    // si llegamos al inicio, volvemos al final
    if(currentIndex < 0) currentIndex = imagenes.length - 1;

    // si llegamos al final, volvemos al inicio
    if(currentIndex >= imagenes.length) currentIndex = 0;

    sliderTrack.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
}



/* MODAL */
function abrirGaleria(src){
    document.getElementById("modal-img").src=src;
    document.getElementById("modal").style.display="flex";
}

function cerrarGaleria(){
    document.getElementById("modal").style.display="none";
}

/* ===== ARRASTRAR CON MOUSE Y DEDO + CLICK NORMAL ===== */
let isDown = false;
let startX = 0;
let scrollLeft = 0;
let moved = false;
const DRAG_THRESHOLD = 10; // pixeles mínimo para considerar arrastre

// BLOQUEO DE CLICK POST-DRAG
let preventClick = false;

sliderTrack.addEventListener('mousedown', e=>{
    isDown = true;
    moved = false;
    preventClick = false;
    startX = e.pageX - sliderTrack.offsetLeft;
    scrollLeft = -currentIndex * itemWidth;
    sliderTrack.style.cursor = 'grabbing';
});

sliderTrack.addEventListener('mousemove', e=>{
    if(!isDown) return;
    const x = e.pageX - sliderTrack.offsetLeft;
    const walk = (x - startX) * 1.8;    
    if(Math.abs(walk) > DRAG_THRESHOLD){
        moved = true;
        preventClick = true; // bloqueamos click
    }
    // calcular nuevo desplazamiento
let newX = scrollLeft + walk;

// límites izquierdo y derecho
const maxScroll = 0; // no se puede mover más a la derecha
const minScroll = -(sliderTrack.scrollWidth - container.offsetWidth); // no se puede mover más a la izquierda

// aplicar límites
if(newX > maxScroll) newX = maxScroll;
if(newX < minScroll) newX = minScroll;

sliderTrack.style.transform = `translateX(${newX}px)`; 

});

sliderTrack.addEventListener('mouseup', e=>{
    sliderTrack.style.cursor='grab';
    isDown = false;

    // actualizar currentIndex según desplazamiento final
    const movedPixels = -parseInt(sliderTrack.style.transform.replace('translateX(', '').replace('px)',''));
    currentIndex = Math.round(movedPixels / itemWidth);

    if(!preventClick){
        const link = e.target.closest('a');
        if(link) window.location.href = link.href;
    }
});

// bloquear click nativo si hubo drag
sliderTrack.addEventListener('click', e=>{
    if(preventClick) e.preventDefault();
});

sliderTrack.addEventListener('mouseleave', ()=>{
    isDown = false; 
    sliderTrack.style.cursor='grab';
});

// ===== AJUSTE CARRUSEL MÓVIL =====
if(window.innerWidth <= 768){
    const MOBILE_DRAG_THRESHOLD = 20;
    let touchStartX = 0;
    let touchScrollLeft = 0;
    let isDragging = false;

    sliderTrack.addEventListener('touchstart', e => {
        isDragging = false;
        touchStartX = e.touches[0].pageX - sliderTrack.offsetLeft;
        touchScrollLeft = -currentIndex * itemWidth;
        sliderTrack.style.transition = "none"; // quita transición mientras arrastras
    });

    sliderTrack.addEventListener('touchmove', e => {
        const x = e.touches[0].pageX - sliderTrack.offsetLeft;
        const walk = x - touchStartX;

        if(Math.abs(walk) > MOBILE_DRAG_THRESHOLD){
            isDragging = true;
        }

        sliderTrack.style.transform = `translateX(${touchScrollLeft + walk}px)`;
    });

    sliderTrack.addEventListener('touchend', e => {
        // Al soltar, volvemos a poner transición suave
        sliderTrack.style.transition = "transform 0.4s ease";

        if(isDragging){
            const movedPixels = -parseInt(sliderTrack.style.transform.replace('translateX(','').replace('px)',''));
            currentIndex = Math.round(movedPixels / itemWidth);
            
            // límites para que no se salga
            if(currentIndex < 0) currentIndex = 0;
            if(currentIndex >= imagenes.length) currentIndex = imagenes.length - 1;

            sliderTrack.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
        } else {
            // Si no hubo arrastre, abre el link tocado
            const touch = e.changedTouches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            const link = element.closest('a');
            if(link) window.location.href = link.href;
        }
    });
}


</script>

</body>
</html>
